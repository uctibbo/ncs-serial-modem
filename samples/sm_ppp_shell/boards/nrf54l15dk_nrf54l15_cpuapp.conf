# Ensure the use of the DTS partitions
CONFIG_USE_DT_CODE_PARTITION=y

# Modem UART uses async API; shell UART uses interrupt-driven.
CONFIG_UART_ASYNC_API=y
CONFIG_MODEM_BACKEND_UART_ASYNC_HWFC=y
CONFIG_MODEM_BACKEND_UART_ISR=n
# uart22 = modem; must not be interrupt-driven so UART_22_ASYNC is unblocked.
CONFIG_UART_22_INTERRUPT_DRIVEN=n
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096

# For debugging purposes, enable GPIO shell commands.
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

# Use LittleFS for file system support.
CONFIG_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_MAP=y

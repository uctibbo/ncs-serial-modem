# Use UART async API with PM_RUNTIME.
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_UART_ASYNC_API=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL_BACKEND_SERIAL_API_ASYNC=y
CONFIG_SHELL_BACKEND_SERIAL=y

# UART20 is routed through VCOM1. UART30/VCOM0 is reserved for the modem.
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_SHELL_BACKEND_RTT=n

# For debugging purposes, enable GPIO shell commands.
CONFIG_GPIO=y
CONFIG_GPIO_SHELL=y

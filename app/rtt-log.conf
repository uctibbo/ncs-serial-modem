# Route the diagnostic console and Zephyr logs through SEGGER RTT.
# Keep the UART log backend disabled so it cannot contend with Serial Modem UARTs.
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

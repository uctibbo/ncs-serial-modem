# Enable host-streamed full modem firmware updates through the AT#XDFU* commands.
CONFIG_SM_DFU_MODEM_FULL=y

# Provide UART RX headroom while the XDFU handler programs the current 4 KiB
# block. This prevents buffer starvation at the 1 Mbaud external-MCU rate.
CONFIG_SM_UART_RX_BUF_COUNT=4
CONFIG_SM_UART_RX_BUF_SIZE=4096

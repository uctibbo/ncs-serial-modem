# Standard NCS LTE Link Control profile for periodic low-power operation.
# Preserve the modem's existing LTE system-mode selection.
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_DEFAULT=y

# Always request PSM when the nRF modem library initializes.
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=3600
CONFIG_LTE_PSM_REQ_RAT_SECONDS=0

# Keep eDRX disabled for this measurement profile.
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_EDRX_REQ=n
